<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viajes — OTRO PLAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #F5A623;
      --red:    #E8441A;
      --blue:   #4A90D9;
      --pink:   #E0197D;
      --dark:   #0D0D0D;
      --dark2:  #181818;
      --light:  #F2F2F2;
      --muted:  #777;
    }

    html, body {
      background: var(--dark);
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(130px); pointer-events: none; z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--orange); top: -100px; right: -100px; opacity: 0.08; animation: float 9s ease-in-out infinite; }
    .blob-2 { width: 400px; height: 400px; background: var(--blue);   bottom: -100px; left: -100px; opacity: 0.08; animation: float 11s ease-in-out infinite reverse; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.4rem 3.5rem;
      background: linear-gradient(to bottom, rgba(13,13,13,0.95) 0%, transparent 100%);
    }
    .nav-logo img { height: 36px; width: auto; display: block; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      color: var(--muted); text-decoration: none;
      font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      transition: color 0.25s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--light); }
    .nav-social { display: flex; gap: 1.1rem; align-items: center; }
    .nav-social a { color: var(--muted); text-decoration: none; transition: color 0.25s; display: flex; }
    .nav-social a:hover { color: var(--light); }
    .nav-social svg { width: 19px; height: 19px; fill: currentColor; }

    main {
      position: relative; z-index: 1;
      padding: 8rem 2rem 5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 8vw, 6rem);
      line-height: 0.95;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 50px; height: 2px;
      background: linear-gradient(to right, var(--orange), var(--pink));
      margin: 0 auto 4rem;
    }

    /* GRID */
    .trips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .trip-card {
      background: var(--dark2);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.3s;
    }
    .trip-card:hover { transform: translateY(-5px); }

    .trip-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .trip-placeholder {
      width: 100%;
      height: 260px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .trip-info {
      padding: 1.2rem 1.5rem 1.5rem;
    }

    .trip-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .trip-date {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 300;
    }

    .card-1 .trip-name { color: var(--orange); }
    .card-2 .trip-name { color: var(--red); }
    .card-3 .trip-name { color: var(--pink); }
    .card-4 .trip-name { color: var(--blue); }
    .card-5 .trip-name { color: var(--pink); }
    .card-6 .trip-name { color: var(--orange); }

    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 2rem;
      color: #333; font-size: 0.75rem;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-24px); }
    }

    @media (max-width: 900px) {
      .trips-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .trips-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

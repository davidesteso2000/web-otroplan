<style>

/* ───────────────────────────── */
/* NAV */
/* ───────────────────────────── */

nav {
  position: fixed;
  top: 12px;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.4rem 3.5rem;
  background: linear-gradient(
    to bottom,
    rgba(13,13,13,0.92) 0%,
    transparent 100%
  );
}

/* ───────────────────────────── */
/* LOGO */
/* ───────────────────────────── */

.nav-logo img {
  height: 40px;
  width: auto;
  display: block;
}

/* ───────────────────────────── */
/* ENLACES */
/* ───────────────────────────── */

.nav-links {
  display: flex;
  gap: 2.5rem;
  list-style: none;
  align-items: center;
}

.nav-links a {
  color: #777;
  text-decoration: none;
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: color 0.25s;
}

.nav-links a:hover,
.nav-links a.active {
  color: #F2F2F2;
}

/* ───────────────────────────── */
/* MENU MÓVIL */
/* ───────────────────────────── */

.menu-toggle {
  display: none;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  width: 30px;
  height: 24px;
  position: relative;
}

.menu-toggle span {
  position: absolute;
  left: 0;
  width: 30px;
  height: 2px;
  background: #F2F2F2;
  transition: all 0.25s ease;
}

.menu-toggle span:nth-child(1) {
  top: 0;
}

.menu-toggle span:nth-child(2) {
  top: 11px;
}

.menu-toggle span:nth-child(3) {
  top: 22px;
}

/* ───────────────────────────── */
/* MENU MÓVIL ABIERTO */
/* ───────────────────────────── */

.mobile-menu {
  display: none;
}

/* ───────────────────────────── */
/* RESPONSIVE */
/* ───────────────────────────── */

@media (max-width: 700px) {

  nav {
    padding: 1rem 1.5rem;
  }

  .nav-links {
    display: none;
  }

  .menu-toggle {
    display: block;
  }

  .mobile-menu {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(13,13,13,0.98);
    padding: 6rem 2rem 2.5rem;
    z-index: -1;
    flex-direction: column;
    align-items: center;
    gap: 1.8rem;
  }

  .mobile-menu.open {
    display: flex;
  }

  .mobile-menu a {
    color: #777;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: color 0.25s;
  }

  .mobile-menu a:hover,
  .mobile-menu a.active {
    color: #F2F2F2;
  }

}

</style>


<nav>

  <!-- LOGO -->

  <a href="index.html" class="nav-logo">
    <img src="logo.png" alt="OTRO PLAN">
  </a>


  <!-- ENLACES ORDENADOR -->

  <ul class="nav-links">
    <li><a href="nosotros.html">Nosotros</a></li>
    <li><a href="viajes.html">Viajes</a></li>
    <li><a href="galeria.html">Galería</a></li>
    <li><a href="proximos.html">Próximos viajes</a></li>
  </ul>


  <!-- BOTÓN MENÚ MÓVIL -->

  <button class="menu-toggle" aria-label="Abrir menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

</nav>


<!-- MENÚ MÓVIL -->

<div class="mobile-menu">

  <a href="nosotros.html">Nosotros</a>
  <a href="viajes.html">Viajes</a>
  <a href="galeria.html">Galería</a>
  <a href="proximos.html">Próximos viajes</a>

</div>


<script>

/* ───────────────────────────── */
/* PÁGINA ACTIVA */
/* ───────────────────────────── */

const currentPage = window.location.pathname.split("/").pop();

document.querySelectorAll(
  '.nav-links a, .mobile-menu a'
).forEach(link => {

  const linkPage = link.getAttribute("href");

  if (linkPage === currentPage) {
    link.classList.add("active");
  }

});


/* ───────────────────────────── */
/* MENÚ MÓVIL */
/* ───────────────────────────── */

const menuToggle = document.querySelector(".menu-toggle");
const mobileMenu = document.querySelector(".mobile-menu");

menuToggle.addEventListener("click", () => {

  mobileMenu.classList.toggle("open");

});

</script>

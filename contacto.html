<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — OTRO PLAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #F5A623;
      --red:    #E8441A;
      --blue:   #4A90D9;
      --pink:   #E0197D;
      --dark:   #0D0D0D;
      --dark2:  #181818;
      --light:  #F2F2F2;
      --muted:  #777;
    }

    html, body {
      background: var(--dark);
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    main {
      position: relative; z-index: 1;
      padding: 8rem 2rem 5rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 0.95;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .page-sub {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 300;
      margin-bottom: 3rem;
    }

    .divider {
      width: 50px; height: 2px;
      background: linear-gradient(to right, var(--orange), var(--pink));
      margin: 0 auto 3rem;
    }

    /* FORMULARIO */
    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-bottom: 3.5rem;
    }

    label {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      display: block;
    }

    input, textarea {
      width: 100%;
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.25s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--pink);
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    .btn-enviar {
      align-self: center;
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 2.5rem;
      border-radius: 999px;
      background: var(--pink);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-enviar:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    /* CONTACTO DIRECTO */
    .contact-direct {
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 2.5rem;
    }

    .contact-direct p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .contact-email {
      color: var(--light);
      font-size: 1.1rem;
      text-decoration: none;
      display: block;
      margin-bottom: 1.5rem;
      transition: color 0.25s;
    }

    .contact-email:hover {
      color: var(--pink);
    }

    .contact-social {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
    }

    .contact-social a {
      color: var(--muted);
      transition: color 0.25s;
      display: flex;
    }

    .contact-social a:hover {
      color: var(--light);
    }

    .contact-social svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div id="nav"></div>

  <main>
    <h1 class="page-title">HABLEMOS</h1>
    <p class="page-sub">¿Tienes alguna pregunta o quieres unirte al próximo viaje?</p>
    <div class="divider"></div>

    <form id="form-contacto">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div>
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" required></textarea>
      </div>
      <button type="submit" class="btn-enviar">Enviar mensaje</button>
    </form>

    <div class="contact-direct">
      <p>O escríbenos directamente</p>
      <a href="mailto:viajes@otroplan.es" class="contact-email">viajes@otroplan.es</a>
      <div class="contact-social">
        <a href="https://www.instagram.com/otroplanviajes/" target="_blank" aria-label="Instagram">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
        <a href="https://www.tiktok.com/@otroplanviajes" target="_blank" aria-label="TikTok">
          <svg viewBox="0 0 24 24">
            <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.75a4.85 4.85 0 01-1.01-.06z"/>
          </svg>
        </a>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script>
    const form = document.getElementById("form-contacto");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value;
      const mensaje = document.getElementById("mensaje").value;

      const cuerpo = encodeURIComponent(
        "Hola, soy " + nombre + ".\n\n" +
        mensaje
      );

      window.location.href = "mailto:viajes@otroplan.es?body=" + cuerpo;
    });
  </script>

  <script>
    fetch("nav.html")
      .then(response => response.text())
      .then(data => {

        document.getElementById("nav").innerHTML = data;

        const currentPage = window.location.pathname.split("/").pop();

        document.querySelectorAll('.nav-links a, .mobile-menu a').forEach(link => {
          if (link.getAttribute("href") === currentPage) {
            link.classList.add("active");
          }
        });

        const menuToggle = document.querySelector(".menu-toggle");
        const mobileMenu = document.querySelector(".mobile-menu");
        const navEl = document.querySelector("nav");

        menuToggle.onclick = function () {
          const abierto = menuToggle.classList.toggle("open");
          mobileMenu.classList.toggle("open");
          navEl.classList.toggle("menu-abierto");
          menuToggle.setAttribute("aria-expanded", abierto ? "true" : "false");
        };

        const submenuToggle = document.querySelector(".submenu-toggle");
        const submenuContent = document.querySelector(".submenu-content");

        submenuToggle.onclick = function () {
          const abierto = submenuToggle.classList.toggle("open");
          submenuContent.classList.toggle("open");
          submenuToggle.setAttribute("aria-expanded", abierto ? "true" : "false");
        };

        document.addEventListener("click", function (e) {

          const clickDentroDelPanel = mobileMenu.contains(e.target);
          const clickEnBoton = menuToggle.contains(e.target);

          if (mobileMenu.classList.contains("open") && !clickDentroDelPanel && !clickEnBoton) {
            menuToggle.classList.remove("open");
            mobileMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
          }

        });

      });
  </script>

  <script>
    fetch("footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
  </script>

</body>
</html>

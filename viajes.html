<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viajes — OTRO PLAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #F5A623;
      --red:    #E8441A;
      --blue:   #4A90D9;
      --pink:   #E0197D;
      --dark:   #0D0D0D;
      --dark2:  #181818;
      --light:  #F2F2F2;
      --muted:  #777;
    }

    html, body {
      background: var(--dark);
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(130px); pointer-events: none; z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--orange); top: -100px; right: -100px; opacity: 0.08; animation: float 9s ease-in-out infinite; }
    .blob-2 { width: 400px; height: 400px; background: var(--blue);   bottom: -100px; left: -100px; opacity: 0.08; animation: float 11s ease-in-out infinite reverse; }

    main {
      position: relative; z-index: 1;
      padding: 8rem 2rem 5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 8vw, 6rem);
      line-height: 0.95;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 50px; height: 2px;
      background: linear-gradient(to right, var(--orange), var(--pink));
      margin: 0 auto 4rem;
    }

    /* GRID */
    .trips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .trip-card {
  background: var(--dark2);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
  transition: transform 0.3s;
  text-decoration: none;
  color: inherit;
}
    .trip-card:hover { transform: translateY(-5px); }

    .trip-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
    }

    .trip-placeholder {
      width: 100%;
      height: 260px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .trip-info {
      padding: 1.2rem 1.5rem 1.5rem;
    }

    .trip-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .trip-date {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 300;
    }

    .card-1 .trip-name { color: var(--orange); }
    .card-2 .trip-name { color: var(--red); }
    .card-3 .trip-name { color: var(--pink); }
    .card-4 .trip-name { color: var(--blue); }
    .card-5 .trip-name { color: var(--pink); }
    .card-6 .trip-name { color: var(--orange); }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-24px); }
    }

    @media (max-width: 900px) {
      .trips-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
           .trips-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!--
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  -->

  <div id="nav"></div>

  <main>
    <h1 class="page-title">
      <span style="color:var(--orange)">DÓNDE</span><br>HEMOS ESTADO.
    </h1>
    <div class="divider"></div>

    <div class="trips-grid">

      <a href="viaje-marruecos.html" class="trip-card card-1">

  <img src="foto-marruecos.jpg"
       alt="Marruecos"
       style="width:100%;height:260px;object-fit:cover;object-position:center center;display:block;">

  <div class="trip-info">
    <div class="trip-name">Marruecos</div>
    <div class="trip-date">Junio 2023</div>
  </div>

</a>

      <div class="trip-card card-2">
        <img src="foto-roma.jpg" alt="Roma" style="width:100%;height:260px;object-fit:cover;object-position:center center;display:block;">
        <div class="trip-info">
          <div class="trip-name">Roma</div>
          <div class="trip-date">Enero 2024</div>
        </div>
      </div>

      <div class="trip-card card-3">
        <img src="foto-paris.jpg" alt="París" style="width:100%;height:260px;object-fit:cover;object-position:center 40%;display:block;">
        <div class="trip-info">
          <div class="trip-name">París</div>
          <div class="trip-date">Noviembre 2024</div>
        </div>
      </div>

      <div class="trip-card card-4">
        <img src="foto-budapest.jpg" alt="Budapest" style="width:100%;height:260px;object-fit:cover;object-position:center center;display:block;">
        <div class="trip-info">
          <div class="trip-name">Budapest</div>
          <div class="trip-date">Febrero 2025</div>
        </div>
      </div>

      <div class="trip-card card-5">
        <img src="foto-tenerife.jpg" alt="Tenerife" style="width:100%;height:260px;object-fit:cover;object-position:center center;display:block;">
        <div class="trip-info">
          <div class="trip-name">Tenerife</div>
          <div class="trip-date">Septiembre 2025</div>
        </div>
      </div>

      <div class="trip-card card-6">
        <img src="foto-londres.jpg" alt="Londres" style="width:100%;height:260px;object-fit:cover;object-position:center center;display:block;">
        <div class="trip-info">
          <div class="trip-name">Londres</div>
          <div class="trip-date">Diciembre 2025</div>
        </div>
      </div>

    </div>
  </main>

<div id="footer"></div>
  
  <script>
    fetch("nav.html")
      .then(response => response.text())
      .then(data => {

        document.getElementById("nav").innerHTML = data;

        const currentPage = window.location.pathname.split("/").pop();

        document.querySelectorAll('.nav-links a, .mobile-menu a').forEach(link => {
          if (link.getAttribute("href") === currentPage) {
            link.classList.add("active");
          }
        });

        const menuToggle = document.querySelector(".menu-toggle");
        const mobileMenu = document.querySelector(".mobile-menu");

        menuToggle.onclick = function () {
          const abierto = menuToggle.classList.toggle("open");
          mobileMenu.classList.toggle("open");
          menuToggle.setAttribute("aria-expanded", abierto ? "true" : "false");
        };

        const submenuToggle = document.querySelector(".submenu-toggle");
        const submenuContent = document.querySelector(".submenu-content");

        submenuToggle.onclick = function () {
          const abierto = submenuToggle.classList.toggle("open");
          submenuContent.classList.toggle("open");
          submenuToggle.setAttribute("aria-expanded", abierto ? "true" : "false");
        };

        document.addEventListener("click", function (e) {

          const clickDentroDelPanel = mobileMenu.contains(e.target);
          const clickEnBoton = menuToggle.contains(e.target);

          if (mobileMenu.classList.contains("open") && !clickDentroDelPanel && !clickEnBoton) {
            menuToggle.classList.remove("open");
            mobileMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
          }

        });

      });
  </script>

<script>
    fetch("footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
  </script>
  
</body>
</html>

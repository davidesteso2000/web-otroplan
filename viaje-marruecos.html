<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marruecos — OTRO PLAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #F5A623;
      --red:    #E8441A;
      --blue:   #4A90D9;
      --pink:   #E0197D;
      --dark:   #0D0D0D;
      --dark2:  #181818;
      --light:  #F2F2F2;
      --muted:  #777;
    }

    html, body {
      background: var(--dark);
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    main {
      position: relative; z-index: 1;
      padding: 8rem 2rem 5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    /* PLACEHOLDER DE FOTO — sustituir por <img> cuando haya foto real */
    .foto-placeholder {
      width: 100%;
      background: #222;
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
    }

    /* PORTADA: 3 fotos en fila */
    .portada-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-bottom: 3rem;
    }

    .portada-grid .foto-placeholder {
      height: 140px;
    }

    .foto-pequena {
      height: 160px;
      margin-top: 0.8rem;
    }

    /* CABECERA */
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      line-height: 0.95;
      color: var(--orange);
      margin-bottom: 0.5rem;
    }

    .page-date {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    .divider {
      width: 50px; height: 2px;
      background: linear-gradient(to right, var(--orange), var(--pink));
      margin-bottom: 3rem;
    }

    /* INTRO */
    .intro p {
      font-size: 1.02rem;
      line-height: 1.8;
      color: #bbb;
      font-weight: 300;
      text-align: justify;
    }
